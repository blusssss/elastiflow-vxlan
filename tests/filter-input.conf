input { generator { count => 1 message => "synthetic-sflow" } }
filter {
  ruby {
    init => "require 'logstash/codecs/sflow'; @sflow = LogStash::Codecs::Sflow.new; @sflow.register"
    code => "
      @sflow.decode(File.binread('/work/fixtures/standard-vxlan.sflow')) do |decoded|
        decoded.set('type', 'sflow')
        decoded.set('host', '192.0.2.10')
        new_event_block.call(decoded)
      end
      event.cancel
    "
  }
}
